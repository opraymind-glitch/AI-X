<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RunStay — マラソン遠征を、もっとかんたんに。</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="data/marathons.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --blue: #1a8fe3;
      --blue-dark: #1270b8;
      --blue-light: #e8f4fd;
      --text: #1a1a2e;
      --gray: #6b7280;
      --white: #ffffff;
    }
    body { font-family: 'Helvetica Neue', 'Hiragino Sans', sans-serif; color: var(--text); background: var(--white); line-height: 1.6; }

    /* ── ヘッダー ── */
    header {
      background: var(--white); padding: 14px 20px;
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid #e5e7eb; position: sticky; top: 0; z-index: 1000;
    }
    .logo { font-size: 1.4rem; font-weight: 800; color: var(--blue); letter-spacing: 0.05em; }
    .header-btn {
      background: var(--blue); color: var(--white); border: none;
      padding: 8px 18px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; cursor: pointer;
    }

    /* ── ヒーロー ── */
    .hero {
      background: linear-gradient(160deg, #1a8fe3 0%, #0d5fa0 100%);
      color: var(--white); text-align: center; padding: 60px 20px 64px;
    }
    .hero h1 { font-size: clamp(1.7rem, 6vw, 2.6rem); font-weight: 900; line-height: 1.3; margin-bottom: 14px; }
    .hero p { font-size: 0.95rem; opacity: 0.9; margin-bottom: 28px; max-width: 320px; margin-left: auto; margin-right: auto; }
    .btn-white {
      display: inline-block; background: var(--white); color: var(--blue);
      font-weight: 800; font-size: 1rem; padding: 14px 36px; border-radius: 50px;
      text-decoration: none; box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      transition: transform 0.15s; cursor: pointer; border: none;
    }
    .btn-white:hover { transform: translateY(-2px); }

    /* ── 検索セクション ── */
    #search-section { background: var(--blue-light); padding: 40px 16px 32px; }
    #search-section h2 { text-align: center; font-size: 1.3rem; font-weight: 800; margin-bottom: 20px; }

    .filter-stack {
      display: flex; flex-direction: column; gap: 12px;
      max-width: 600px; margin: 0 auto 16px;
    }

    /* フィルターブロック */
    .filter-block {
      background: var(--white); border-radius: 12px;
      border: 1.5px solid #c7dff5; overflow: hidden;
    }
    .filter-block-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 14px; cursor: default;
    }
    .filter-block-header .block-label {
      font-size: 0.78rem; font-weight: 700; color: var(--blue-dark);
    }
    .filter-block-header .block-value {
      font-size: 0.85rem; color: var(--gray); font-weight: 500;
    }
    .filter-row {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
      padding: 0 14px 14px;
    }
    .filter-row.single { grid-template-columns: 1fr; }

    .filter-group label {
      display: block; font-size: 0.75rem; font-weight: 700;
      color: var(--blue-dark); margin-bottom: 4px;
    }
    .filter-group select {
      width: 100%; padding: 9px 10px; border: 1.5px solid #c7dff5;
      border-radius: 8px; font-size: 0.9rem; background: var(--white);
      appearance: none; -webkit-appearance: none;
    }
    .filter-group select:focus { outline: none; border-color: var(--blue); }
    .filter-group select:disabled { background: #f3f4f6; color: #aaa; }

    /* サブフィルター（スライドイン） */
    .sub-filter {
      max-height: 0; overflow: hidden;
      transition: max-height 0.3s ease, padding 0.3s ease;
      padding: 0 14px;
    }
    .sub-filter.open {
      max-height: 200px;
      padding: 0 14px 14px;
    }
    .sub-filter .filter-group { margin-top: 4px; }
    .sub-filter-label {
      font-size: 0.72rem; color: var(--blue); font-weight: 700;
      margin-bottom: 6px; display: none;
    }
    .sub-filter.open .sub-filter-label { display: block; }

    /* チェックボックスタグ */
    .tag-checks { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 14px 14px; }
    .tag-checks label {
      display: flex; align-items: center; gap: 5px;
      background: var(--white); border: 1.5px solid #c7dff5;
      border-radius: 20px; padding: 5px 12px; font-size: 0.85rem;
      cursor: pointer; transition: all 0.15s;
    }
    .tag-checks input[type=checkbox] { accent-color: var(--blue); width: 14px; height: 14px; }
    .tag-checks label:has(input:checked) {
      background: var(--blue); color: white; border-color: var(--blue);
    }

    /* サブタイプチェック（スライドイン） */
    .subtype-area {
      max-height: 0; overflow: hidden;
      transition: max-height 0.3s ease;
      background: #f0f8ff;
      border-top: 1px solid #c7dff5;
    }
    .subtype-area.open { max-height: 200px; }
    .subtype-area-inner { padding: 10px 14px 14px; }
    .subtype-area-inner .sub-label {
      font-size: 0.72rem; font-weight: 700; color: var(--blue-dark); margin-bottom: 8px;
    }

    .search-btn {
      display: block; width: 100%; max-width: 600px; margin: 0 auto;
      background: var(--blue); color: var(--white); border: none;
      padding: 14px; border-radius: 10px; font-size: 1rem; font-weight: 700;
      cursor: pointer; transition: background 0.15s;
    }
    .search-btn:hover { background: var(--blue-dark); }

    /* ── 地図 ── */
    #map { width: 100%; height: 60vh; min-height: 320px; }

    /* ── 凡例 ── */
    #legend {
      display: none; padding: 12px 16px;
      background: var(--blue-light); border-top: 1px solid #c7dff5;
    }
    #legend.visible { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; }
    .legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.82rem; font-weight: 600; }
    .legend-dot { width: 14px; height: 14px; border-radius: 50%; }

    /* ── ローディング ── */
    #loading { display: none; text-align: center; padding: 20px; font-size: 0.9rem; color: var(--gray); }
    #loading.visible { display: block; }

    /* ── 結果リスト ── */
    #results-section { padding: 20px 16px; }
    #results-section h3 { font-size: 1rem; font-weight: 700; margin-bottom: 12px; color: var(--gray); }
    #result-list { display: flex; flex-direction: column; gap: 10px; max-width: 600px; margin: 0 auto; }
    .result-card {
      background: var(--white); border: 1.5px solid #e5e7eb;
      border-radius: 12px; padding: 14px 16px; cursor: pointer;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .result-card:hover, .result-card.active {
      border-color: var(--blue); box-shadow: 0 0 0 3px rgba(26,143,227,0.12);
    }
    .result-card .card-name { font-weight: 700; font-size: 0.95rem; margin-bottom: 4px; }
    .result-card .card-meta { font-size: 0.8rem; color: var(--gray); display: flex; flex-wrap: wrap; gap: 8px; }
    .tag { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 0.75rem; font-weight: 600; }
    .tag-road  { background: #dbeafe; color: #1d4ed8; }
    .tag-trail { background: #dcfce7; color: #15803d; }
    .tag-track { background: #fef9c3; color: #854d0e; }
    .tag-ultra { background: #fce7f3; color: #9d174d; }

    /* ── CTA ── */
    .cta-section {
      background: linear-gradient(160deg, #1a8fe3 0%, #0d5fa0 100%);
      color: var(--white); text-align: center; padding: 56px 24px;
    }
    .cta-section h2 { font-size: 1.4rem; font-weight: 900; margin-bottom: 10px; }
    .cta-section p  { font-size: 0.9rem; opacity: 0.85; margin-bottom: 28px; }

    footer { background: var(--text); color: #aaa; text-align: center; padding: 20px; font-size: 0.78rem; }

    /* ── キーワード検索 ── */
    .keyword-block {
      background: var(--white); border-radius: 12px;
      border: 1.5px solid #c7dff5; overflow: hidden;
      padding: 12px 14px;
    }
    .keyword-block label {
      display: block; font-size: 0.78rem; font-weight: 700;
      color: var(--blue-dark); margin-bottom: 6px;
    }
    .keyword-wrap {
      display: flex; gap: 8px; align-items: center;
    }
    .keyword-wrap input {
      flex: 1; padding: 9px 12px; border: 1.5px solid #c7dff5;
      border-radius: 8px; font-size: 0.95rem; background: var(--white);
    }
    .keyword-wrap input:focus { outline: none; border-color: var(--blue); }
    .keyword-wrap input::placeholder { color: #bbb; }
    .keyword-clear {
      background: none; border: none; font-size: 1.1rem;
      color: #aaa; cursor: pointer; padding: 4px 6px; line-height: 1;
    }
    .keyword-clear:hover { color: var(--text); }
  </style>
</head>
<body>

<!-- ヘッダー -->
<header>
  <div class="logo">RunStay</div>
  <button class="header-btn" onclick="scrollToApp()">アプリを入手</button>
</header>

<!-- ヒーロー -->
<section class="hero">
  <h1>大会もホテルも、<br>これ1本で。</h1>
  <p>全国のマラソン大会を検索して、開催地周辺の宿泊施設・交通機関・コンビニをまとめて確認。</p>
  <button class="btn-white" onclick="scrollToSearch()">今すぐ大会を探す ↓</button>
</section>

<!-- 検索セクション -->
<section id="search-section">
  <h2>🔍 大会を探す</h2>
  <div class="filter-stack">

    <!-- ⓪ キーワード -->
    <div class="keyword-block">
      <label>大会名・キーワードで探す</label>
      <div class="keyword-wrap">
        <input type="text" id="filter-keyword" placeholder="例：東京、富士、トレイル、100km…"
          oninput="onKeywordInput()" />
        <button class="keyword-clear" onclick="clearKeyword()" title="クリア">✕</button>
      </div>
    </div>

    <!-- ① 開催地 -->
    <div class="filter-block">
      <div class="filter-block-header">
        <span class="block-label">📍 開催地</span>
        <span class="block-value" id="loc-summary">すべての地域</span>
      </div>
      <div class="filter-row">
        <div class="filter-group">
          <label>地域</label>
          <select id="filter-region" onchange="onRegionChange()">
            <option value="">すべての地域</option>
            <option>北海道</option><option>東北</option><option>関東</option>
            <option>中部</option><option>近畿</option><option>中国</option>
            <option>四国</option><option>九州・沖縄</option>
          </select>
        </div>
        <div class="filter-group">
          <label>都道府県</label>
          <select id="filter-pref" disabled onchange="updateLocSummary()">
            <option value="">地域を先に選択</option>
          </select>
        </div>
      </div>
    </div>

    <!-- ② 開催時期 -->
    <div class="filter-block">
      <div class="filter-block-header">
        <span class="block-label">📅 開催時期</span>
        <span class="block-value" id="date-summary">すべての時期</span>
      </div>
      <div class="filter-row">
        <div class="filter-group">
          <label>月</label>
          <select id="filter-month" onchange="onMonthChange()">
            <option value="">すべての月</option>
            <option value="1">1月</option><option value="2">2月</option>
            <option value="3">3月</option><option value="4">4月</option>
            <option value="5">5月</option><option value="6">6月</option>
            <option value="7">7月</option><option value="8">8月</option>
            <option value="9">9月</option><option value="10">10月</option>
            <option value="11">11月</option><option value="12">12月</option>
          </select>
        </div>
        <div class="filter-group">
          <label>週</label>
          <select id="filter-week" disabled onchange="updateDateSummary()">
            <option value="">月を先に選択</option>
          </select>
        </div>
      </div>
    </div>

    <!-- ③ レース種別 -->
    <div class="filter-block">
      <div class="filter-block-header">
        <span class="block-label">🏃 レース種別</span>
        <span class="block-value" id="type-summary">すべての種別</span>
      </div>

      <!-- 大種別 -->
      <div class="tag-checks" id="main-type-checks">
        <label><input type="checkbox" name="main" value="ロード"  onchange="onMainTypeChange()"> ロード</label>
        <label><input type="checkbox" name="main" value="トレイル" onchange="onMainTypeChange()"> トレイル</label>
        <label><input type="checkbox" name="main" value="ウルトラ" onchange="onMainTypeChange()"> ウルトラ</label>
      </div>

      <!-- サブ種別（選択後に展開） -->
      <div class="subtype-area" id="subtype-area">
        <div class="subtype-area-inner">
          <div class="sub-label">▸ 詳細種目を選択（任意）</div>
          <div class="tag-checks" id="sub-type-checks"></div>
        </div>
      </div>
    </div>

  </div>
  <button class="search-btn" onclick="doSearch()">検索する</button>
</section>

<!-- ローディング -->
<div id="loading">📍 施設情報を取得中...</div>

<!-- 凡例 -->
<div id="legend">
  <div class="legend-item"><div class="legend-dot" style="background:#1a8fe3"></div>大会会場</div>
  <div class="legend-item"><div class="legend-dot" style="background:#f97316"></div>ホテル</div>
  <div class="legend-item"><div class="legend-dot" style="background:#22c55e"></div>駅</div>
  <div class="legend-item"><div class="legend-dot" style="background:#ef4444"></div>コンビニ</div>
</div>

<!-- 地図 -->
<div id="map"></div>

<!-- 結果リスト -->
<section id="results-section">
  <h3 id="result-count"></h3>
  <div id="result-list"></div>
</section>

<!-- CTA -->
<section class="cta-section">
  <h2>アプリ版も近日公開！</h2>
  <p>通知機能・オフラインマップなど、さらに便利になります。</p>
  <button class="btn-white">事前登録する（無料）</button>
</section>

<footer>© 2026 RunStay · 大会データはサンプルです</footer>

<script>
// ── マスタデータ ──
const PREF_BY_REGION = {
  "北海道":   ["北海道"],
  "東北":     ["青森県","岩手県","宮城県","秋田県","山形県","福島県"],
  "関東":     ["茨城県","栃木県","群馬県","埼玉県","千葉県","東京都","神奈川県"],
  "中部":     ["新潟県","富山県","石川県","福井県","山梨県","長野県","岐阜県","静岡県","愛知県"],
  "近畿":     ["三重県","滋賀県","京都府","大阪府","兵庫県","奈良県","和歌山県"],
  "中国":     ["鳥取県","島根県","岡山県","広島県","山口県"],
  "四国":     ["徳島県","香川県","愛媛県","高知県"],
  "九州・沖縄":["福岡県","佐賀県","長崎県","熊本県","大分県","宮崎県","鹿児島県","沖縄県"]
};

const SUBTYPES = {
  "ロード":  ["フルマラソン(42.195km)", "ハーフマラソン(21km)", "10km", "5km以下"],
  "トレイル":["ショート(〜30km)", "ミドル(30〜80km)", "ロング(80km〜)"],
  "ウルトラ":["50km", "100km", "200km以上"]
};

// MARATHONS は data/marathons.js から読み込み済み

// ── キーワード検索 ──
function onKeywordInput() {
  // 入力中はリアルタイムで絞り込み
  doSearch();
}

function clearKeyword() {
  document.getElementById('filter-keyword').value = '';
  doSearch();
}

// ── 地域 → 都道府県 ──
function onRegionChange() {
  const region = document.getElementById('filter-region').value;
  const prefSel = document.getElementById('filter-pref');
  if (region) {
    prefSel.innerHTML = '<option value="">すべて</option>';
    PREF_BY_REGION[region].forEach(p => prefSel.innerHTML += `<option value="${p}">${p}</option>`);
    prefSel.disabled = false;
  } else {
    prefSel.innerHTML = '<option value="">地域を先に選択</option>';
    prefSel.disabled = true;
  }
  updateLocSummary();
}

function updateLocSummary() {
  const r = document.getElementById('filter-region').value;
  const p = document.getElementById('filter-pref').value;
  document.getElementById('loc-summary').textContent = p || r || 'すべての地域';
}

// ── 月 → 週 ──
function onMonthChange() {
  const month = document.getElementById('filter-month').value;
  const weekSel = document.getElementById('filter-week');
  if (month) {
    weekSel.innerHTML = '<option value="">すべての週</option>'
      + ['第1週','第2週','第3週','第4週'].map((w,i) => `<option value="${i+1}">${w}</option>`).join('');
    weekSel.disabled = false;
  } else {
    weekSel.innerHTML = '<option value="">月を先に選択</option>';
    weekSel.disabled = true;
    weekSel.value = '';
  }
  updateDateSummary();
}

function updateDateSummary() {
  const m = document.getElementById('filter-month').value;
  const w = document.getElementById('filter-week').value;
  let txt = 'すべての時期';
  if (m && w) txt = `${m}月 第${w}週`;
  else if (m) txt = `${m}月`;
  document.getElementById('date-summary').textContent = txt;
}

// ── 大種別 → サブ種別 ──
function onMainTypeChange() {
  const checked = [...document.querySelectorAll('#main-type-checks input:checked')].map(c => c.value);
  const subArea = document.getElementById('subtype-area');
  const subChecks = document.getElementById('sub-type-checks');

  if (checked.length === 0) {
    subArea.classList.remove('open');
    subChecks.innerHTML = '';
  } else {
    // 選択された大種別のサブタイプを収集（重複除去）
    const subs = [...new Set(checked.flatMap(t => SUBTYPES[t] || []))];
    subChecks.innerHTML = subs.map(s =>
      `<label><input type="checkbox" name="sub" value="${s}"> ${s}</label>`
    ).join('');
    subArea.classList.add('open');
  }
  updateTypeSummary();
}

function updateTypeSummary() {
  const main = [...document.querySelectorAll('#main-type-checks input:checked')].map(c => c.value);
  document.getElementById('type-summary').textContent = main.length ? main.join('・') : 'すべての種別';
}

// ── 地図初期化 ──
const map = L.map('map').setView([36.5, 137.0], 5);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap contributors'
}).addTo(map);

let raceMarkers = [], facilityMarkers = [];

function makeIcon(color, size=14) {
  return L.divIcon({
    className: '',
    html: `<div style="width:${size}px;height:${size}px;border-radius:50%;background:${color};border:2px solid white;box-shadow:0 1px 4px rgba(0,0,0,0.4)"></div>`,
    iconSize: [size, size], iconAnchor: [size/2, size/2]
  });
}

// ── 検索 ──
function doSearch() {
  const keyword = document.getElementById('filter-keyword').value.trim().toLowerCase();
  const region  = document.getElementById('filter-region').value;
  const pref    = document.getElementById('filter-pref').value;
  const month   = parseInt(document.getElementById('filter-month').value) || null;
  const week    = parseInt(document.getElementById('filter-week').value)  || null;
  const mainTypes = [...document.querySelectorAll('#main-type-checks input:checked')].map(c => c.value);
  const subTypes  = [...document.querySelectorAll('#sub-type-checks input:checked')].map(c => c.value);

  clearFacilityMarkers(); clearRaceMarkers();
  document.getElementById('legend').classList.remove('visible');

  let results = MARATHONS.filter(m => {
    // キーワード：大会名・都道府県・種別・距離・備考を横断検索
    if (keyword) {
      const hay = [m.name, m.pref, m.region, m.type, m.subtype, m.dist, m.note]
        .join(' ').toLowerCase();
      if (!hay.includes(keyword)) return false;
    }
    if (region && m.region !== region) return false;
    if (pref   && m.pref   !== pref)   return false;
    if (month  && m.month  !== month)  return false;
    if (week   && m.week   !== week)   return false;
    if (mainTypes.length && !mainTypes.includes(m.type)) return false;
    if (subTypes.length  && !subTypes.includes(m.subtype)) return false;
    return true;
  });

  renderResults(results);
  renderRaceMarkers(results);
}

function renderRaceMarkers(races) {
  races.forEach(r => {
    const marker = L.marker([r.lat, r.lng], { icon: makeIcon('#1a8fe3', 16) })
      .addTo(map)
      .bindPopup(`<b>${r.name}</b><br>${r.pref} | ${r.month}月第${r.week}週<br>${r.type} / ${r.subtype}`);
    marker.on('click', () => selectRace(r));
    raceMarkers.push(marker);
  });
  if (races.length > 0) {
    map.fitBounds(L.featureGroup(raceMarkers).getBounds().pad(0.2));
  }
}

function clearRaceMarkers()    { raceMarkers.forEach(m => map.removeLayer(m));    raceMarkers = []; }
function clearFacilityMarkers(){ facilityMarkers.forEach(m => map.removeLayer(m)); facilityMarkers = []; }

function renderResults(races) {
  const listEl  = document.getElementById('result-list');
  const countEl = document.getElementById('result-count');
  listEl.innerHTML = '';
  countEl.textContent = races.length > 0 ? `${races.length}件の大会が見つかりました` : '条件に合う大会が見つかりませんでした';

  races.forEach(r => {
    const tc = {ロード:'tag-road',トレイル:'tag-trail',トラック:'tag-track',ウルトラ:'tag-ultra'}[r.type]||'tag-road';
    const card = document.createElement('div');
    card.className = 'result-card';
    card.innerHTML = `
      <div class="card-name">${r.name}</div>
      <div class="card-meta">
        <span>📍 ${r.pref}</span>
        <span>📅 ${r.month}月 第${r.week}週</span>
        <span>🏃 ${r.subtype}</span>
        <span class="tag ${tc}">${r.type}</span>
      </div>`;
    card.addEventListener('click', () => {
      document.querySelectorAll('.result-card').forEach(c => c.classList.remove('active'));
      card.classList.add('active');
      selectRace(r);
    });
    listEl.appendChild(card);
  });
}

// ── 大会選択 → 周辺施設 ──
async function selectRace(race) {
  map.setView([race.lat, race.lng], 14);
  clearFacilityMarkers();
  document.getElementById('loading').classList.add('visible');
  document.getElementById('legend').classList.remove('visible');
  try {
    const facilities = await fetchNearby(race.lat, race.lng, 1500);
    document.getElementById('loading').classList.remove('visible');
    document.getElementById('legend').classList.add('visible');
    renderFacilityMarkers(facilities);
  } catch(e) {
    document.getElementById('loading').classList.remove('visible');
    alert('施設情報の取得に失敗しました。しばらくしてから再試行してください。');
  }
}

async function fetchNearby(lat, lng, radius) {
  const q = `[out:json][timeout:20];
(
  node["tourism"="hotel"](around:${radius},${lat},${lng});
  node["amenity"="hotel"](around:${radius},${lat},${lng});
  node["amenity"="guest_house"](around:${radius},${lat},${lng});
  node["railway"="station"](around:${radius},${lat},${lng});
  node["shop"="convenience"](around:${radius},${lat},${lng});
);out body;`;
  const res = await fetch(`https://overpass-api.de/api/interpreter?data=${encodeURIComponent(q)}`);
  const data = await res.json();
  return data.elements;
}

function renderFacilityMarkers(elements) {
  elements.forEach(el => {
    if (!el.lat || !el.lon) return;
    const tags = el.tags || {};
    let color, label;
    if (tags.tourism==='hotel'||tags.amenity==='hotel'||tags.amenity==='guest_house') {
      color='#f97316'; label='🏨 '+(tags.name||'ホテル');
    } else if (tags.railway==='station') {
      color='#22c55e'; label='🚉 '+(tags.name||'駅');
    } else if (tags.shop==='convenience') {
      color='#ef4444'; label='🏪 '+(tags.name||'コンビニ');
    } else return;
    facilityMarkers.push(L.marker([el.lat,el.lon],{icon:makeIcon(color,12)}).addTo(map).bindPopup(label));
  });
}

function scrollToSearch() {
  document.getElementById('search-section').scrollIntoView({behavior:'smooth'});
}

function scrollToApp() {
  document.querySelector('.cta-section').scrollIntoView({behavior:'smooth'});
}

doSearch();
